name: Run tests

on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-github:
    name: CCOpt - ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
          os: [ubuntu-latest, windows-latest, macos-latest]
          # Julia 1.10 does not read [sources], which points to the unregistered MadNLP.jl
          # packages; restore it once those packages are registered.
          julia-version: ['1', 'pre']
          julia-arch: [x64]
    steps:
      - uses: dorny/paths-filter@v4
        if: |
          github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            moi:
              - 'ext/CCOptMathOptInterface/**'
              - 'test/MOI_wrapper.jl'
      - name: add mot tests # run moi tests on master and if the wrapper is changed.
        if: |
          github.event_name == 'push' ||
          steps.changes.outputs.moi == 'true'
        shell: bash
        run: |
          echo "TEST_ARGS='MOI'" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          test_args: ${{ env.TEST_ARGS }}